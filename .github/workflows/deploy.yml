name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday-morning rebuilds so scheduled posts publish on their date without a
    # push. Hugo omits future-dated content, so a post appears at the first build
    # after its timestamp. Articles are dated 07:00 local, and these fire several
    # attempts across the 07:00-08:00 local window (plus a post-08:00 safety net),
    # so a post is reliably live BY 08:00 even when GitHub delays a scheduled run
    # by 10-30 min, as it often does. Cron is UTC, so each local time needs a
    # summer (BST, UTC+1) and a winter (GMT, UTC+0) entry:
    #   06:05 UTC = 07:05 BST  |  07:05 UTC = 07:05 GMT   first attempt
    #   06:25 UTC = 07:25 BST  |  07:25 UTC = 07:25 GMT   retry
    #   06:45 UTC = 07:45 BST  |  07:45 UTC = 07:45 GMT   retry
    #   07:05 UTC = 08:05 BST  |  08:05 UTC = 08:05 GMT   safety net (past 08:00)
    # Off-season entries fire outside that window and just rebuild with no new
    # post, which is harmless.
    - cron: '5 6 * * 1'
    - cron: '25 6 * * 1'
    - cron: '45 6 * * 1'
    - cron: '5 7 * * 1'
    - cron: '25 7 * * 1'
    - cron: '45 7 * * 1'
    - cron: '5 8 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.140.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        # baseURL is taken from hugo.toml (the canonical .com domain), so the
        # canonical/sitemap URLs stay correct even while staging on .net.
        run: hugo --minify --gc
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
