name: Link check

# Weekly outbound-link check. Catches external URLs that have moved or died —
# the failure mode that reading the prose cannot see (two dead MoneyHelper URLs
# slipped through that way). Internal Hugo links are validated by the build
# itself, so this checks external http(s) links in the Markdown source only,
# which also means next Monday's still-future article is checked before it goes
# live. It never fails the build and keeps a single reusable report issue
# rather than opening a new one each week.

on:
  workflow_dispatch:
  schedule:
    # Monday 06:30 UTC, ahead of the 07:05/08:05 publish rebuilds in deploy.yml.
    - cron: '30 6 * * 1'

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # content/**/*.md is the Hugo content tree (money, politics, gaming …).
          # --scheme limits checking to external http(s) links; scheme-less
          # internal links like /money/ are left to the Hugo build to validate.
          args: >-
            --no-progress
            --cache --max-cache-age 1d
            --scheme https --scheme http
            --exclude-mail
            "content/**/*.md"
          output: ./lychee-report.md
          # Never fail this workflow, so it can never affect deploys.
          fail: false

      - name: Open or update the report issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link checker report"
          num=$(gh issue list --state open --search "$title in:title" --json number,title \
                --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file ./lychee-report.md
            gh issue comment "$num" --body "Re-checked $(date -u +%F): broken external links still present; report updated above."
          else
            gh issue create --title "$title" --body-file ./lychee-report.md
          fi

      - name: Close the report issue when links are clean
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Link checker report"
          num=$(gh issue list --state open --search "$title in:title" --json number,title \
                --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "All external links passed on $(date -u +%F). Closing."
            gh issue close "$num"
          fi
